networks:
  mongo-net:
    name: mongo-replica-net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

x-mongo-common: &mongo-common
  image: mongo:7.0
  restart: unless-stopped
  entrypoint: ["/bin/bash", "-c"]
  environment:
    MONGO_INITDB_ROOT_USERNAME: admin
    MONGO_INITDB_ROOT_PASSWORD: AdminPass123
  healthcheck:
    test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok", "--quiet"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s

services:
  mongo1:
    <<: *mongo-common
    container_name: mongo1
    hostname: mongo1
    networks:
      mongo-net:
        ipv4_address: 172.20.0.11
    ports:
      - "27017:27017"
    volumes:
      - mongo1-data:/data/db
      - ./mongo-keyfile:/auth/keyfile:ro
    command:
      - >-
        install -m 0400 -o 999 -g 999 /auth/keyfile /tmp/keyfile &&
        exec /usr/local/bin/docker-entrypoint.sh mongod
        --replSet rs0
        --keyFile /tmp/keyfile
        --bind_ip_all
        --port 27017

  mongo2:
    <<: *mongo-common
    container_name: mongo2
    hostname: mongo2
    networks:
      mongo-net:
        ipv4_address: 172.20.0.12
    ports:
      - "27018:27017"
    volumes:
      - mongo2-data:/data/db
      - ./mongo-keyfile:/auth/keyfile:ro
    command:
      - >-
        install -m 0400 -o 999 -g 999 /auth/keyfile /tmp/keyfile &&
        exec /usr/local/bin/docker-entrypoint.sh mongod
        --replSet rs0
        --keyFile /tmp/keyfile
        --bind_ip_all
        --port 27017

  mongo3:
    <<: *mongo-common
    container_name: mongo3
    hostname: mongo3
    networks:
      mongo-net:
        ipv4_address: 172.20.0.13
    ports:
      - "27019:27017"
    volumes:
      - mongo3-data:/data/db
      - ./mongo-keyfile:/auth/keyfile:ro
    command:
      - >-
        install -m 0400 -o 999 -g 999 /auth/keyfile /tmp/keyfile &&
        exec /usr/local/bin/docker-entrypoint.sh mongod
        --replSet rs0
        --keyFile /tmp/keyfile
        --bind_ip_all
        --port 27017

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped
    networks:
      mongo-net:
        ipv4_address: 172.20.0.20
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: AdminPass123
      ME_CONFIG_MONGODB_URL: mongodb://admin:AdminPass123@mongo1:27017,mongo2:27017,mongo3:27017/admin?replicaSet=rs0&authSource=admin
      ME_CONFIG_BASICAUTH: "false"

volumes:
  mongo1-data:
    name: mongo1-data
  mongo2-data:
    name: mongo2-data
  mongo3-data:
    name: mongo3-data
